<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background -->
  <rect width="32" height="32" rx="7" fill="#020617"/>
  <!-- Outer ring accent -->
  <rect width="32" height="32" rx="7" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Signal pulse bars (left-aligned, ascending heights) -->
  <rect x="5" y="20" width="3" height="7" rx="1.5" fill="#10b981" opacity="0.4"/>
  <rect x="10" y="15" width="3" height="12" rx="1.5" fill="#10b981" opacity="0.6"/>
  <rect x="15" y="10" width="3" height="17" rx="1.5" fill="#10b981" opacity="0.85"/>
  <rect x="20" y="6" width="3" height="21" rx="1.5" fill="#10b981"/>
  <!-- Live dot top-right -->
  <circle cx="27" cy="6" r="2.5" fill="#10b981"/>
</svg>
